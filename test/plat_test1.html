function roundToNearestMultiple(value, multiple) { return Math.round(value / multiple) * multiple; }

function roundy(value, f) { return Math.round(value * f)/f; }

function rangeCheck(value, max, min) {return min <= value && value <= max}

function _clampy(v, max, min, e) {return rangeCheck(v, max, min) ? e : v} // strange clamp hehe

function normalClamp(v, max, min) {return rangeCheck(v, max, min) ? v : Math.max(min, Math.min(max, v))}

function sin(x) {return Math.sin(toRadians(x))}

function cos(x) {return Math.cos(toRadians(x))}

function toRadians(x) {return x * Math.PI / 180}

function gcd(a, b) {
	if (!b) return a;
	return gcd(b, Math.floor(a % b));
}

function toRatio(fraction) {
	let length = fraction.toString().length - 2
	let denominator = Math.pow(10, length)
	let numerator = fraction * denominator
	let divisor = gcd(numerator, denominator)
	numerator /= divisor
	denominator /= divisor
	divisor = null
	length = null
	return {width: numerator, height: denominator}
}

function drawText(ctx, x, y, text, font, color, lineWidth=0) {
    ctx.font = font
    ctx.fillStyle = color
    ctx.strokeStyle = color
    if (lineWidth > 0) {ctx.lineWidth = lineWidth; ctx.strokeText(text, x, y)} else {ctx.fillText(text, x, y)}
}

function drawCircle(ctx, x, y, radius, lineWidth=0, startAngle=0, endAngle=Math.PI*2) {
	ctx.beginPath()
	ctx.arc(x, y, radius, startAngle, endAngle)
	if (lineWidth==0) {
		ctx.fill()
	} else {
		ctx.lineWidth = lineWidth
		ctx.stroke()
	}
}

function drawLine(ctx, x, y, ex, ey) {
	ctx.beginPath()
	ctx.moveTo(x, y)
	ctx.lineTo(ex, ey)
	ctx.stroke()
}

function drawRect(context, x, y, w, h, lineWidth=0) {
	if (lineWidth == 0) {
		context.fillRect(x, y, w, h)
	} else {
		context.lineWidth = lineWidth
		context.strokeRect(x, y, w, h)
	}
}

	constructor() {
		this.canvas = document.querySelector("canvas")
		this.context = this.canvas.getContext("2d")
		this.ratio = {width: 1, height: 1}
		this.canvas_size = 70*devicePixelRatio
		this.canvasScale = 1
		this.targetFps = 30
		this.maxFrameTime = 250
		this.deltaTime = -1
		this.game = new Game(this)
	}

	cancelSmoothing(bool=false) {
        this.context.mozImageSmoothingEnabled = bool;
        this.context.webkitImageSmoothingEnabled = bool;
        this.context.msImageSmoothingEnabled = bool;
        this.context.imageSmoothingEnabled = bool
	}

	frame(dt) {this.game.frame(dt * this.deltaTime)}
	draw() {
		this.context.clearRect(0, 0, this.canvas.width, this.canvas.height)
		this.game.draw()
	}
	start({fps}) {
		window.addEventListener("resize", this.resize.bind(this))
		document.addEventListener("visibilitychange", this.toggleTab.bind(this))	
		this.targetFps = fps
		this.deltaTime = this.targetFps/1000
		this.game.start()
		let last = 0
		let frameTime = 0
		let accumulator = 0.0
		let dt = 16
		const loop = (now) => {
			frameTime = now - last
			if (frameTime > this.maxFrameTime) {frameTime = this.maxFrameTime}
			last = now
			accumulator += frameTime
			while (accumulator >= dt) {
				this.frame(dt)
				accumulator -= dt
			}
			this.draw()
			requestAnimationFrame(loop)
		}
		loop(0)
	}

	initCanvas(w, h) {
		this.ratio.width = w
		this.ratio.height = h
		this._changeCanvasSize()
		this.game.init()
	}

	_changeCanvasSize() {
		this.canvas.width = this.ratio.width * this.canvas_size
		this.canvas.height = this.ratio.height * this.canvas_size
	}

	toggleTab() {if (document.visibilityState == "visible") { this.game.unpause() } else { this.game.pause() }}

	resize() {
        let ratio = this.ratio
		if (window.innerWidth > window.innerHeight){
            this.canvas.style.height = window.innerHeight + "px";
            this.canvas.style.width = (this.canvas.offsetHeight * ratio.width/ratio.height) + "px";
            if (this.canvas.offsetWidth > window.innerWidth){
                this.canvas.style.height = (window.innerWidth * .01 / ratio.width * ratio.height * 100) + "px";
                this.canvas.style.width  = (this.canvas.offsetHeight * ratio.width / ratio.height) + "px";
            }
        } else {
            this.canvas.style.width = window.innerWidth + "px";
            this.canvas.style.height = (this.canvas.offsetWidth * ratio.height/ratio.width) + "px";
        }
        this.canvasScale = this.canvas.offsetWidth / this.canvas.width
	}
}

class Object2d {
	static NAME = "Object2d"
	#destroyed = false
	#camera = null; #hasAnimation=false;
	#cameraAttraction = {
		x: 0,
		y: 0,
		targetX: null, // don't change targetX&Y
		targetY: null,
		radius: 350,
		innerRadius: 150,
		zoom: 1.25,
		zoomPower: 1,
		enabled: true, // enabled in use?
		hasAttraction: false, // called .addPointOfInterest ?
		power: 1, // 0-1 range
		parent: null
	}
	static t = {NORMAL: 0, SCENE: 1, CAMERA: 2, PARENT: 3}
	constructor() {
        this.x = 0
        this.y = 0
        this.vx = 0
        this.vy = 0
		this._parent = null
		this.type = Object2d.t.NORMAL
		this.IS_OBJECT_2D = true
		this.animation = null
    }
	__hasAnimation() {return this.#hasAnimation}
	attachAnimation(animation) {this.animation = animation; this.#hasAnimation=true}
	drawAnimation(context, camera, ox=0, oy=0, center=true, scaleImage=1, flip=false) {if (this.#hasAnimation) {
		this.animation.draw(context, camera.toScreenX(this.x + ox), camera.toScreenY(this.y + oy), camera.scale, 0, center, scaleImage, flip)
	}}
	updateAnimation(dt) {
		if (this.#hasAnimation) {
			this.animation.update(dt)
		}
	}
	// best to NOT call __ methods unless you are changing framework
	__becomeCameraTarget(camera) {this.#camera = camera}
	__parentCamera() {return this.#camera}
	__stopBeingCameraTarget() {this.#camera = null}
	// these don't activate what their function names are, they are called from Camera2d methods
	__becomeCameraInterest(camera) {this.#cameraAttraction.parent = camera; this.#cameraAttraction.hasAttraction=true}
	__stopBeingCameraInterest(camera) {this.#cameraAttraction.parent = null; this.#cameraAttraction.hasAttraction=false}
	getCameraAttractionObject() {return this.#cameraAttraction}

	destroy() {
		this.#destroyed = true
		this._parent = null
		this.animation.destroy()
		this.animation = null
		if (this.__parentCamera()) {this.__parentCamera().setTarget(null)}
		if (this.#cameraAttraction.parent) {
			this.#cameraAttraction.parent.removePointOfInterest(this)	
		}
	}

	getDestroyed() { return this.#destroyed }

	setParent(parent) { this._parent = parent }

    update(dt) {
        this.x += this.vx * dt
        this.y += this.vy * dt
    }

    draw(context, camera) {
		context.fillRect(camera.toScreenX(this.x), camera.toScreenY(this.y), 10*camera.scale, 10*camera.scale)
    }
	
	debugDraw(context, camera) {
		let x = camera.toScreenX(this.x + this.#cameraAttraction.x)
		let y = camera.toScreenY(this.y + this.#cameraAttraction.y)
		if (this.#cameraAttraction.hasAttraction) {
			context.strokeStyle = Game.COLORS.DEBUG.STROKE
			drawCircle(context, x, y, this.#cameraAttraction.radius*camera.scale, 2*camera.scale)
			drawCircle(context, x, y, this.#cameraAttraction.innerRadius*camera.scale, 2*camera.scale)
			if (this.#cameraAttraction.targetX != null) {
				drawLine(context, x, y, camera.toScreenX(this.#cameraAttraction.targetX), camera.toScreenY(this.#cameraAttraction.targetY))
				this.#cameraAttraction.targetX = null
				this.#cameraAttraction.targetY = null

			}
		}
		camera.debugText(context, x, y, "x: {0}, y: {1}".format(Math.round(this.x), Math.round(this.y)))
	}
}

class BasicCamera2d extends Object2d {
    #scale = 1
	#hiddenScale = 1/(16*devicePixelRatio)
	#scaleOffset = 0
	#hiddenOffset = {x: 0, y: 0}
	#__isDebug = false
	constructor() {
        super()
		this.type = Object2d.t.CAMERA
		this.scale = 1
		this.window = {width: 0, height: 0}
		this.__offset = {x: 0, y: 0, easeX: 0.05, easeY: 0.1}
	}
	debugText(context, x, y, text, size=18) {
		drawText(context, x, y, text, Game.COLORS.DEBUG.FONT.format(size*this.scale), Game.COLORS.DEBUG.TEXT, 0)
	}
	update(dt) {
		super.update(dt)
		this.#hiddenOffset.x += (this.__offset.x - this.#hiddenOffset.x)*this.__offset.easeX*dt
		this.#hiddenOffset.y += (this.__offset.y - this.#hiddenOffset.y)*this.__offset.easeY*dt
		this.#hiddenOffset.x = _clampy(Math.round(this.#hiddenOffset.x * 100)/100, 0.2, -0.2, 0)
		this.#hiddenOffset.y = _clampy(Math.round(this.#hiddenOffset.y * 100)/100, 0.2, -0.2, 0)
	}
	set scale(s) { this.#scale = s }
	getTrueScale() {return this.#scale}
	changeScale(delta) {this.scale = delta + this.getTrueScale()}
	get scale() { return roundToNearestMultiple(this.__getDisplayScale(), this.#hiddenScale)*devicePixelRatio }
	get scaleOffset () {return this.#scaleOffset}
	set scaleOffset(o) {this.#scaleOffset = o}
	setDimensions(w, h) {this.window.width = w*0.5, this.window.height = h*0.5}
	toScreenX(x) { return Math.round(Math.floor(x + this.getOffsetX())*this.scale) + this.window.width }
	toScreenY(y) { return Math.round(Math.floor(y + this.getOffsetY())*this.scale) + this.window.height }
	getOffsetX() {return -Math.floor(this.__getDisplayOffsetX()+this.#hiddenOffset.x)}
	getOffsetY() {return -Math.floor(this.__getDisplayOffsetY()+this.#hiddenOffset.y)}
	__getDisplayOffsetX() {return this.x}
	__getDisplayOffsetY() {return this.y}
	__getDisplayScale() {return this.#scale + this.#scaleOffset}
	set offsetX(v) {this.__offset.x = v}
	set offsetY(v) {this.__offset.y = v}

class Camera2d extends BasicCamera2d {
	#target = null
	#hasTarget = false
	#smoothedX = 0
	#smoothedY = 0
	#smoothScale = 1
	#smoothEase = 0.1
	#smoothScaleEase = 0.05
	#lockX = false
	#lockY = false
	#lockMargin = 2
	constructor() {
		super()
		this.ease = {x: 0.125, y: 0.1}
		this.track = {x: 0, y: 0}
		this.pointsOfInterest = []
	}

	addPointOfInterest(object) {
		this.pointsOfInterest.push(object)
		object.__becomeCameraInterest(this)
	}

	removePointOfInterest(object) {
		this.pointsOfInterest.splice(this.pointsOfInterest.indexOf(object), 1)
		object.__stopBeingCameraInterest(this)
	}

	update(dt) {
		super.update(dt)
		if (this.#hasTarget) {
			this.trackTarget(this.#target)
			this.x += this.track.x * dt
			this.y += this.track.y * dt
		}
		let newCamX = 0
		let newCamY = 0
		let newScale = 0
		let length = 0
		this.pointsOfInterest.forEach(interest => {
			let attraction = interest.getCameraAttractionObject()
			if (attraction.enabled) {
				let x = interest.x + attraction.x
				let y = interest.y + attraction.y
				let boundingCheck = rangeCheck(this.x, x + attraction.radius, x - attraction.radius) && rangeCheck(this.y, y + attraction.radius, y - attraction.radius)
				if (boundingCheck) { // sqrt computation are cost heavy, so skip
					let d = (x- this.x)**2 + (y - this.y)**2
					d = Math.sqrt(d)
					if (d < attraction.radius) {
						if (d < attraction.innerRadius) {
							newScale += (attraction.zoom - this.getTrueScale())
							newCamX += (x - this.x) * attraction.power
							newCamY += (y - this.y) * attraction.power
						} else {
							let influence = 1 - (d - attraction.innerRadius)/(attraction.radius - attraction.innerRadius)
							newScale += (attraction.zoom - this.getTrueScale()) * attraction.zoomPower * influence
							influence *= attraction.power
							newCamX += (x - this.x)*influence
							newCamY += (y - this.y)*influence
						}
						interest.getCameraAttractionObject().targetX = this.__getDisplayOffsetX()
						interest.getCameraAttractionObject().targetY = this.__getDisplayOffsetY()
						length++
					}
				}
			}
			attraction = null
		})
		if (length > 0) {
			this.lerpSmoothedX(dt, this.x + newCamX/length)
			this.lerpSmoothedY(dt, this.y + newCamY/length)
			this.lerpSmoothScale(dt, this.getTrueScale() + newScale/length)
			this.#lockY = false
			this.#lockX = false
		} else {
			this.lerpSmoothScale(dt, this.getTrueScale())
			if (this.#lockX) {this.#smoothedX = this.x} else {
				this.lerpSmoothedX(dt, this.x)
				if (Math.abs(this.x - this.#smoothedX) < this.#lockMargin) {
					this.#lockX = true
				}
			}
			if (this.#lockY) {this.#smoothedY = this.y} else {
				this.lerpSmoothedY(dt, this.y)
				if (Math.abs(this.y - this.#smoothedY) < this.#lockMargin) {
					this.#lockY = true
				}
			}
		}
	}
	lerpSmoothScale(dt, target) {this.#smoothScale += (target - this.#smoothScale)*this.#smoothScaleEase*dt}
	lerpSmoothedX(dt, target) {this.#smoothedX += (target - this.#smoothedX)*this.#smoothEase*dt}
	lerpSmoothedY(dt, target) {this.#smoothedY += (target - this.#smoothedY)*this.#smoothEase*dt}
	__getDisplayOffsetX() {return this.#smoothedX}
	__getDisplayOffsetY() {return this.#smoothedY}
	__getDisplayScale() {return this.#smoothScale + this.scaleOffset}

	trackTarget(target) {
		let dx = target.x - this.x
		let dy = target.y - this.y
		this.track.x = dx * this.ease.x
		this.track.y = dy * this.ease.y
	}

	setTarget(target) {
		if (this.#target) {this.#target.__stopBeingCameraTarget()}
		if (target == null) {
			this.#target = null
			this.#hasTarget = false
			return;
		}
		this.#target = target
		this.#target.__becomeCameraTarget(this)
		this.#hasTarget = true
	}

	destroy() {
		super.destroy()
		this.setTarget(null)
	}
}

class Object2dParent extends Object2d {

		super()

		super.destroy()

		this._forAllChildren(i => {
			this.children[i].destroy()

		})

			delete this.children_keys[k]
		})
	}

	_forAllChildren(callback) { for (let i = this.children.length - 1; i >= 0; i--) { callback.call(null, i) } }
	
	addChild(child) {
		this.children.push(child)
		if (child.IS_OBJECT_2D) {
			child.setParent(this)
		}
	}

	removeChild(child) { this.children.splice(this.children.indexOf(child), 1) }

		 this.removeChild(this.getChildById(id))

	}

	update(dt) { super.update(dt); this._forAllChildren(i => this.children[i].update(dt)) }

	draw(context, camera) { this._forAllChildren(i => this.children[i].draw(context, camera)) }

	debugDraw(context, camera) {this._forAllChildren(i => this.children[i].debugDraw(context, camera))}
}

class PhysicsRect extends Rect {
	#dummyRect=new Rect(0, 0, 0, 0)
	constructor(x, y, w, h) {
		super(x, y, w, h)

		this.deltaVelocity = {x: 0, y: 0, __lastX: 0, __lastY: 0, gravity: 0, gt: false}
	}
	destroy() {super.destroy(); this.tilemaps = null}
	addTilemap(t) {
		this.tilemaps.push(t)
		this.#setCollisionOffsets(t.tile * t.scale)
	}
	applyMovement(dt) {
		this.deltaVelocity.gravity = 0
		this.deltaVelocity.gt = false
		if (!this.collisions.bottom) {
			this.deltaVelocity.gravity = this.gravityFactor * (this.vy > 0 ? this.downFactor : 1) 
			this.vy += this.deltaVelocity.gravity * dt
			if (this.vy > this.terminalVelocity) {
				this.deltaVelocity.gravity = this.terminalVelocity - (this.vy - this.deltaVelocity.gravity*dt)
				this.deltaVelocity.gt = true
				this.vy = this.terminalVelocity
			}
		}
	}
	update(dt) {
		this.applyMovement(dt)
		this.checkCollisions(dt)
		this.deltaVelocity.x = this.vx - this.deltaVelocity.__lastX
		this.deltaVelocity.y = this.vy - this.deltaVelocity.__lastY
		this.deltaVelocity.__lastX = this.vx
		this.deltaVelocity.__lastY = this.vy
	}
	isGrounded() { return this.collisions.bottom }
	checkCollisions(dt) {
        this.x += this.vx * dt
		this.collisions.left = false
		this.collisions.right = false
		for (let i = this.tilemaps.length - 1; i >= 0; i--) {
			let c = this.checkCollisionsX(this.tilemaps[i])
			Object.keys(c).forEach(direction => {
				if (c[direction]) {
					this.collisions[direction] = true
				}
			})
		}
		this.y += this.vy * dt
		this.collisions.top = false
		this.collisions.bottom = false
		for (let i = this.tilemaps.length - 1; i >= 0; i--) {
			let c = this.checkCollisionsY(this.tilemaps[i])
			Object.keys(c).forEach(direction => {
				if (c[direction]) {
					this.collisions[direction] = true
				}
			})
		}		
	}
	checkCollisionsX(tilemap) {
		let collisions = {left: false, right: false}
		for (const r of this.collision(tilemap)) {
			if (this.vx > 0) {
				this.vx = 0;
				this.right = r.left
				collisions.right = 0
			} else if (this.vx < 0) {
				this.vx = 0;
				this.left = r.right
				collisions.left = true
			}
		}
		return collisions
	}
	checkCollisionsY(tilemap) {
		let collisions = {top: false, bottom: false}
		for (const r of this.collision(tilemap)) {
			if (this.vy > 0) {
				this.bottom = r.top
				this.vy = 0
				collisions.bottom = true
			} else if (this.vy < 0) {
				this.top = r.bottom
				this.vy = 0
				collisions.top = true
			}
		}
		return collisions
	}
	collision(tilemap) {
        let m = tilemap.tile * tilemap.scale;let xP = Math.floor(this.x/m);let yP = Math.floor(this.y/m);let r = []
		this.#dummyRect.width = m
		this.#dummyRect.height = m
		for (const offset of this.collisionDirections) {
            let t = tilemap.getTile(xP + offset[0] , yP + offset[1])
            if (t) {if (tilemap.getSolid(t.type)) {
					this.#dummyRect.x = t.x*m
					this.#dummyRect.y = t.y*m
                    if (this.colliderect(t.hasRect ? t.rect : this.#dummyRect)) {
                        r.push(t.hasRect ? t.rect.copy() : this.#dummyRect)
					}
				}
            }
        }; xP = null;yP = null;m = null;return r
    }

    #setCollisionOffsets(tile) {
        let widthTiles = Math.ceil(this.width/tile)
        let heightTiles = Math.ceil(this.height/tile)
        this.collisionDirections = TileGen.fullFill(0, (widthTiles * 2 + 1)*(heightTiles*2 + 1))
        let i = 0
        for (let x = 0; x < widthTiles * 2 + 1; ++x) {
            for (let y = 0; y < heightTiles * 2 + 1; ++y) { 
				this.collisionDirections[i] = [x - widthTiles, y - heightTiles]; i++
            }
        }; i = null;widthTiles = null;heightTiles = null 
    }
}

class TileMap {

            [1, -1], // top right

            [0, 1], // bottom middle

    }

		} else {

                    let t = this.getTile(x - scrollX, y - scrollY)
                    if (t) {
                        this.types[t.type + ((t.slope == 0) ? "" : "slope")].draw(context, camera, t, this.tile, this.scale)
                    }

    setTile(x, y, type=null, sloped=false) {
        delete this.data[this.key(x, y)]

    }

    // a function that generates a tile given type and position

    key(x, y) { return x + ", " + y}
    resize(canvas) {
        this.screenSize[0] = Math.ceil(canvas.width/(this.tile * this.scale))
        this.screenSize[1] = Math.ceil(canvas.height/(this.tile * this.scale))
        this.screenSize[2] = this.screenSize[0] * this.screenSize[1]
    }
}
class TileSorter {

class Tile {

    }

    getNeighbors(directions, map) {
        let neighbors = ""; directions.forEach((d) => {
            let tile = map.getTile(this.x + d[0], this.y + d[1]); if (tile) { neighbors += (tile.type === this.type) ? "1" : "0" } else { neighbors += "0"}

class slopeTile extends Tile {
    constructor(x, y, type) { super(x, y, type); this.slope = 1 }
    checkEquals(neighbor1, neighbor2) {
        if (neighbor1 === "x" || neighbor2 === "x") { return false }
        for (let i = 0; i < Math.min(neighbor1.length, neighbor2.length); ++i) {
            let a1 = neighbor1[i]
            let a2 = neighbor2[i]
            if (a1 !== a2 && a1 !== "x" && a2 !== "x") {
                return false
            }
        }
        return neighbor1.length == neighbor2.length
    }
    correct(directions, map) {
        this.neighbors = this.getNeighbors(directions, map)
        let key = Object.keys(map.types[this.type + "slope"].key)
        for (let i = 0; i < key.length; ++i) {
            if (this.checkEquals(this.neighbors, key[i])) {

class __BasicSpriteAnimation extends State {
	#images = []; #baseImage = null; #hasImage = false; #time = 0; #flippedImage = null
	static canvas = document.createElement("canvas"); static c = this.canvas.getContext("2d")
	constructor() {super(); this.frame=0; this.defaultTime=8;}
	async load(sheet, flip=false, clipColor="255, 255, 255",) {
		if (!sheet.decoded) {
			await sheet.load()
		}
		this.setBaseImage(sheet.image)
		this.addImages(sheet.images(clipColor))
		if (flip) {
			this.setFlippedFrames(sheet.reversedImages(clipColor))
			this.setFlippedImage(sheet.reversed)
		}
	}
	setBaseImage(image) {this.#hasImage=true;this.#baseImage=image}
	setFlippedFrames(images) {
		for(let i = 0; i < images.length; ++i) {
			this.#images[i].setFlippedRect(images[i])
		}
	}
	getBaseImage() {return this.#baseImage} getFlippedImage() {return this.#flippedImage}
	setFlippedImage(image) {this.#flippedImage = image}
	addImages(images) {images.forEach(i => this.#images.push(new __SpriteAnimationFrame(this, i)));}
	destroy() {super.destroy(); this.#images.forEach(i => i.destroy()); this.#images=null;this.#baseImage=null}
	getFrame(i) {return this.#images[i]}
	setFrame(i) {this.frame=Math.max(Math.min(i, this.#images.length), 0)}
	nextFrame(){this.setFrame((this.frame + 1)%this.#images.length)}
	update(dt) {
		this.#time += dt
		let t = this.getFrame(this.frame).length || this.defaultTime
		if (this.#time >= t) {
			this.#time = 0
			this.nextFrame()
		}
	}
	draw(context, x, y, scale, frame=this.frame, center=true, os=1, reverse=false) {this.getFrame(frame).draw(context, x, y, scale, center, os, reverse)}
	enter(reset=true) {
		super.enter()
		if (reset) {this.frame = 0}
	}
}

class __SpriteAnimationFrame {
	constructor(animation, rect) {
		this.animation = animation
		this.length = null
		this.rect = rect
		this.__flippedRect = null
	}
	setFlippedRect(rect) {this.__flippedRect = rect}
	draw(context, x, y, scale, center, os, flip=false) {
		let dw = this.rect.width*scale*os
		let dh = this.rect.height*scale*os
		let image;
		let rect;
		if (flip) {
			image = this.animation.getFlippedImage()
			rect = this.__flippedRect
		} else {
			image = this.animation.getBaseImage()
			rect = this.rect
		}
		context.drawImage(image, rect.x, rect.y, rect.width, rect.height, 
		x + (center ? -dw*0.5 : 0), y + (center ? -dh : 0), dw, dh
		)
	}
	destroy() {this.animation = null; this.rect = null}
}

class Spring {
	#active = false
	#debugRadii = 10
	constructor() {
		this.x = 0
		this.y = 0
		this.anchorX = 0
		this.anchorY = 0
		this.vx = 0
		this.vy = 0
		this.acceleration = {x: 0, y: 0}
		this.mass = 1
		this.stiffness = 0
		this.damping = 2
		this.length = 20
		this.clamp = 3
	}

	boom({direction, force, stiffness, mass}) {
		this.x += cos(direction) * force
		this.y += sin(direction) * force
		this.stiffness = stiffness
		this.mass = mass
		this.vx = 0
		this.vy = 0
		this.#active = true
	}

	__updatePositions(dt, fx, fy) {
		this.acceleration.x = fx/this.mass
		this.acceleration.y = fy/this.mass
		this.vx += this.acceleration.x * dt
		this.vy += this.acceleration.y * dt
		this.x += this.vx * dt
		this.y += this.vy * dt
	}

	update(dt) {
		if (!this.#active) {
			return;
		}
		let velocityMagnitude = this.vx ** 2 + this.vy ** 2
		velocityMagnitude = Math.sqrt(velocityMagnitude)
		if (Math.abs(velocityMagnitude) <= this.clamp) {
			this.#active = false
			this.vx = 0
			this.vy = 0
			this.x = 0
			this.y = 0
			return;
		}
		let fx = -this.stiffness * (this.x - this.length)
		let fy = -this.stiffness * (this.y - this.length)
		let dampX = -this.damping * this.vx
		let dampY = -this.damping * this.vy
		this.__updatePositions(dt, fx + dampX, fy + dampY)

	}

	updateAsConnected(dt, spring) {
		let dx = (this.x + this.anchorX) - (spring.anchorY + spring.x*0)
		let dy = (this.y + this.anchorY) - (spring.anchorY + spring.y*0)
		let magnitude = dx ** 2 + dy ** 2
		magnitude = Math.sqrt(magnitude)
	
		let fx = dx/magnitude
		let fy = dy/magnitude
		let force = this.stiffness * (magnitude - this.length)
		let relativeVx = spring.vx - this.vx
		let relativeVy = spring.vy - this.vy
		fx = fx * force - this.damping * relativeVx
		fy = fy * force - this.damping * relativeVy
		this.__updatePositions(dt, -fx, -fy)
		// spring.__updatePositions(dt, 0.1, 0.1)

		this.chainPositionTo(spring)
		// spring.chainPositionTo(this)
	}

	chainPositionTo(spring) {
		this.anchorX = spring.anchorX + spring.x
		this.anchorY = spring.anchorY + spring.y
	}

	debugDraw() {}

	draw(context, camera) {
		let x1 = camera.toScreenX(this.anchorX)
		let y1 = camera.toScreenY(this.anchorY)
		let x2 = camera.toScreenX(this.anchorX + this.x)
		let y2 = camera.toScreenY(this.anchorY + this.y)
		if (this.name) {
			context.fillStyle = "rgba(255, 0, 0, .3)"
		}
		context.lineWidth = 2 * camera.scale
		drawLine(context, x1, y1, x2, y2)
		drawCircle(context, x1, y1, this.#debugRadii*camera.scale)
		drawCircle(context, x2, y2, this.#debugRadii*camera.scale)

	}
}

class SpringChain {
	// updateAsConnected ?
	constructor() {
		this.x = 0
		this.y = 0
		this.anchorChain = new Spring()
		this.anchorChain.name = true
		this.springs = []
		this.gravity = true
	}

	update(dt) {
		this.anchorChain.update(dt)
		for (let i = 0; i < this.springs.length; ++i) {
			this.springs[i].updateAsConnected(dt, i - 1 >= 0 ? this.springs[i-1] : this.anchorChain)
		}
	}

	debugDraw() {}

	draw(context, camera) {
		for (let i = 0; i < this.springs.length; ++i) {
			this.springs[i].draw(context, camera, this.x, this.y, i==this.springs.length-1)
		}
	}

	add(spring) {this.springs.push(spring)}
}

class Player extends PhysicsRect {
	constructor(x, y, w, h) {
		super(x, y, w, h)
		this.controls = new Movement2dControls()
		this.movement = {
			acceleration: 0.5*0.5,
			friction: 0.4*0.6,
			max: 6,
			jumpHeight: 50,
			jumpInterval: 0.08,
			jumpCount: 0,
			jumpCountStarted: false,
			jumpFallEase: 0.5,
			co: { // camera offset
				x: 0,
				y: 0,
				stepX: 0.05,
				stepY: 0.1,
			}
		}
	}

	applyMovement(dt) {
		super.applyMovement(dt)
		let x = this.controls.axisX()
		let y = this.controls.axisY()
		// this.__parentCamera().offsetX = this.movement.co.x * this.width * 5
		if (x == 0) {
			let sign = Math.sign(this.vx)
			if (Math.abs(this.vx) > this.movement.friction) {
				this.vx -= this.movement.friction * sign
			} else {
				this.vx = 0
			}
			if (Math.abs(this.movement.co.x) > this.movement.co.stepX) {
				this.movement.co.x -= dt * this.movement.co.stepX * Math.sign(this.movement.co.x)
			} else {
				this.movement.co.x = 0
			}
		} else {
			this.movement.co.x += this.movement.co.stepX * x * dt
			this.movement.co.x = normalClamp(this.movement.co.x, 1, -1)
			if (this.vx * x < this.movement.max) {
				this.vx += this.movement.acceleration * x * dt
			} else {
				this.vx = this.movement.max * x
			}
		}
		if (y <= 0) {
			if (this.movement.jumpCountStarted) {
				this.__haltJump(dt)
			}
			this.movement.jumpCount = 0
		} else {
			if (this.isGrounded()) {
				this.movement.jumpCount = 0
				this.movement.jumpCountStarted = true
			}
			if (this.movement.jumpCountStarted) {
				this.movement.jumpCount = this.movement.jumpCount + this.movement.jumpInterval*dt
				if (this.movement.jumpCount < 1) {
					this.vy = -this.movement.jumpInterval*this.movement.jumpHeight - this.deltaVelocity.gravity
				} else {
					this.movement.jumpCount = 1
					this.__haltJump(dt)
				}
			}
		}
	}

	__haltJump(dt) {
		this.movement.jumpCountStarted = false
		if (this.vy < 0) {
			this.vy *= this.movement.jumpFallEase
		}
	}

	draw(context, camera) {
		super.draw(context, camera)
	}
}
