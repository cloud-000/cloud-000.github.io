function main() {
	devicePixelRatio = Math.floor(devicePixelRatio)
	const MAIN = new Main()
	MAIN.initCanvas(16, 9)
	MAIN.cancelSmoothing()
	MAIN.resize()

function roundToNearestMultiple(value, multiple) { return Math.round(value / multiple) * multiple; }
function rangeCheck(value, max, min) {return min <= value && value <= max}
function _clampy(v, max, min, e) {return rangeCheck(v, max, min) ? e : v} // strange clamp hehe
function normalClamp(v, max, min) {return rangeCheck(v, max, min) ? v : Math.max(min, Math.min(max, v))}
function drawText(ctx, x, y, text, font, color, lineWidth=0) {ctx.font = font; ctx.fillStyle = color; ctx.strokeStyle = color; if (lineWidth > 0) {ctx.lineWidth = lineWidth; ctx.strokeText(text, x, y)} else {ctx.fillText(text, x, y)}}
function drawCircle(ctx, x, y, radius, lineWidth=0, startAngle=0, endAngle=Math.PI*2) {ctx.beginPath(); ctx.arc(x, y, radius, startAngle, endAngle); if (lineWidth==0) {ctx.fill() } else {ctx.lineWidth = lineWidth; ctx.stroke() }}
function drawLine(ctx, x, y, ex, ey) {ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(ex, ey); ctx.stroke()}
function drawRect(context, x, y, w, h, lineWidth=0) {if (lineWidth == 0) {context.fillRect(x, y, w, h)} else {context.lineWidth = lineWidth; context.strokeRect(x, y, w, h)}}
function drawPolygon(context, x, y, points, lineWidth=0, scale=1) {
    context.beginPath()
    context.moveTo(x, y)
    for (let i = 0; i < points.length; ++i) {
        context.lineTo(x + points[i][0]*scale, y + points[i][1]*scale)
    }
    context.lineTo(x + points[0][0]*scale, y + points[0][1]*scale)
    context.closePath()
    if (lineWidth == 0) {
        context.fill()
    } else {
        context.lineWidth = lineWidth
        context.stroke()
    }
}
function dist(a, b, c, d) {return Math.sqrt((a-c)**2 + (b-d)**2)}
function randint(min, max) {return Math.floor(Math.random() * (max - min + 1)) + min}
function choice(array) {return array[randint(0, array.length - 1)]}
function shuffle(array) {
    let currentIndex = array.length;
    while (currentIndex != 0) {
        let randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [
        array[randomIndex], array[currentIndex]];
    }
}
function shuffleSubarray(arr, start, end) {
    if (start < 0 || end >= arr.length || start >= end) {throw new Error("Invalid start or end indices");}
    for (let i = end; i > start; i--) {
        const j = Math.floor(Math.random() * (i - start + 1)) + start;
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}

function choiceMultiple(array, count) {
    let copied = [...array]
    shuffle(copied)
    let result = copied.slice(0, count)
    copied = null
    return result
}
function randomIndices(length, count) {return choiceMultiple(Array.from({length: length}, (_, i) => i + 1), count)}
function randomTwoIndexes(l) {let i1 = randint(0, l - 1); let i2 = randint(0, l - 1); if (i1 == i2) { i2 = (i1 + 1)%l} return [i1, i2]}
function swapItems(array) {if (array.length < 2) {return array}; let [i1, i2] = randomTwoIndexes(array.length); [array[i1], array[i2]] = [array[i2], array[i1]]; return array} 

class Game { // https://lospec.com/palette-list/pelennor8
	static COLORS = {
		BACKGROUND: ["rgb(134, 201, 235)", "#c0bfc0"],
		PRIMARY: ["#4e495f", "#816271", "#997577", "#c3a38a"],
		SECONDARY: ["#20394f", "#0f2a3f", "#08141e"],
		DEBUG: {
			TEXT: "#af3c3c",
			STROKE: "rgba(79, 126, 201, 0.4)",
			FONT: "{0}px arial"
		}
	}
	#hiddenDelta = 1
	constructor(main) {
		this.main = main
		this.manager = new GStateManager()
		this.manager.main = this
	}

	async init() {
		await this.manager.addState("test", new (class extends GState {
			constructor() {
				super()
				this.scene = new Scene2d()
                this.scene.camera.scale = 0.25
                this.scene.camera.debug = true
                this.droneTest = new DroneTest()
                this.particleManager = new ParticleManager()
                this.scene.addChild(this.particleManager)

                this.droneTest.isTraining = true
                setTimeout(() => this.droneTest.train(10), 0)
                // this.droneTest.nextGeneration()
			}

            enter() {
                super.enter()
                this.scene.camera.setDimensions(this.stateValues.parent.main.main.canvas.width, this.stateValues.parent.main.main.canvas.height)
            }

            frame(dt) {
                this.scene.update(dt)
                if (this.droneTest.isTraining) {
                    return;
                }
                this.droneTest.frame(dt)
            }

            draw() {
                this.scene.draw(this.stateValues.parent.main.main.context)
                if (this.droneTest.isTraining) {
                    return;
                }
                this.droneTest.draw(this.stateValues.parent.main.main.context, this.scene.camera)
                this.droneTest.__forEach(i => this.spawnParticles(this.droneTest.population[i].drone))
            }

            spawnParticles(d) {
                this.spawnBooster(d, "right", 1)
                this.spawnBooster(d, "left", -1)

            }

            spawnBooster(d, r, s) {
                let a = d.thrusters[r].angle*d.thrusters[r].max_angle - Math.PI / 2
                for (let i = 0; i < Math.floor(d.thrust_force[r]*3); ++i) {
                    this.particleManager.particle(new Particle2d(d.x + s*d.thrust_force.dx, d.y + s*d.thrust_force.dy, a + Math.random()*Math.PI*0.5, -Math.random()*10, Math.random()*10 + 10))
                }       
            }
		})())
		this.manager.state = "test"
	}start() {}
	frame(dt) {let delta = roundToNearestMultiple(dt, 0.05)*this.#hiddenDelta; this.manager.frame(delta)}
	draw() {
		this.main.context.fillStyle = Game.COLORS.BACKGROUND[0]
		this.main.context.fillRect(0, 0, this.main.canvas.width, this.main.canvas.height)
		this.main.context.fillStyle = Game.COLORS.PRIMARY[2]
		this.manager.draw()
	}
	pause() {
		// this.manager.state = null
		this.#hiddenDelta = 0
	}
	unpause() {
		setTimeout(() => {
			if (document.visibilityState == "visible") {
				this.#hiddenDelta = 1
			}
		}, 100);
		// this.manager.state = "test1"
	}
}

class ParticleManager extends Object2dParent {
    constructor() {
        super()
    }
    particle(p) {this.addChild(p)}
    update(dt) {
        super.update(dt)
        this._forAllChildren(i => {
            if (this.children[i].dead) {
                this.children.splice(i, 1)
            }
        })
    }

}

class Particle2d extends Object2d {
    constructor(x, y, direction, force, life) {
        super()
        this.x = x
        this.y = y
        this.ease = 0.8
        this.size = 2
        this.sizeIncrease = 0.5
        this.life = life
        this.maxLife = life
        this.dead = false
        this.color = "rgba(86, 106, 122, {0})"
        this.init(direction, force)
    }

    init(direction, force) {
        this.vx = Math.cos(direction) * force
        this.vy = Math.sin(direction) * force
    }

    apply(dt) {
        this.vx *= this.ease
        this.vy *= this.ease
        this.size += dt * this.sizeIncrease
        this.life -= dt
        if (this.life <= 0) {
            this.dead = true
        }
    }

    update(dt) {
        super.update(dt)
        this.apply(dt)
    }

    draw(context, camera) {
        context.fillStyle = this.color.format(this.life/this.maxLife * 0.5)
        drawCircle(context, camera.toScreenX(this.x), camera.toScreenY(this.y), this.size*camera.scale, 0)
    }

    debugDraw() {}
}

class Polygon {
    #useCache = false
    #cache = null
    #cacheSize = 0
    #cacheIndex = null
    constructor(points=[]) {
        this.points = points
        this.linePoints = this.points.slice()
        this.scale = 1
        this.angle = 0
        // cache implement later
        // bding box
    }

    destroy() {
        this.points = null
        this.linePoints = null
        this.#cache = null
    }

    createCache(pieces=72) {
        this.#useCache = true
        this.#cache = Array.from({length: pieces})
        this.#cacheSize = Math.floor(360/pieces)
        this.rotate = this.__cacheRotate.bind(this)
        this.draw = this.__cacheDraw.bind(this)
        this.rotate(this.angle)
    }

    trueRotate(angle) {
        this.rotate(angle)
        this.angle = 0
        this.points = this.linePoints.slice()
    }

    rotatePoint(i, angle) {
        let sine = Math.sin(angle)
        let cosine = Math.cos(angle)
        return [
            cosine * this.points[i][0] - sine * this.points[i][1],
            sine * this.points[i][0] + cosine * this.points[i][1]
        ]
    }
    rotate(a) {this.__rotate(a)}
    __rotate(angle) {
        this.angle = angle
        for (let i = 0; i < this.linePoints.length; ++i) {
            this.linePoints[i] = this.rotatePoint(i, this.angle)
        }
    }
    __cacheRotate(angle) {
        let approx = roundToNearestMultiple(angle*180/Math.PI, this.#cacheSize)%360
        approx = approx < 0 ? approx + 360 : approx
        let index = Math.floor(approx/this.#cacheSize)
        if (index == this.#cacheIndex) {return;}
        if (this.#cache[index] !== undefined) {
        } else {
            this.__rotate(approx*Math.PI/180)
            this.#cache[index] = this.linePoints.slice()
        }
        this.#cacheIndex = index
    }

    __cacheDraw(c, x, y, lw, s) {drawPolygon(c, x, y, this.#cache[this.#cacheIndex], lw, s*this.scale)}

    __draw(context, x, y, lineWidth=0, scale=1) {drawPolygon(context, x, y, this.linePoints, lineWidth, scale*this.scale)}

    draw(context, x, y, lineWidth=0, scale=1) {this.__draw(context, x, y, lineWidth, scale)}
}

class Drone extends Object2d {
    static HalfPI = Math.PI / 2
    constructor(render=true) {
        super()
        this.angular_velocity = 0
        this.angle = 0
        this.thrusters = {
            left: new Thruster(),
            right: new Thruster()
        }
        this.thrusters_offset = 120
        this.inertia = 0.8
        this.damping = 0.9
        this.gravity = 3
        this.terminal = 9.8 * this.gravity
        this.renderPrepped = false
        if (render) {
            this.initRender()
        }
        this.thrust_force = {left: 0, right: 0, dx: 0, dy: 0}
    }

    initRender() {
        let t = this.thrusters_offset
        let w = 5
        this.polygon = new Polygon([[-t, -w], [t, -w], [t, w], [-t, w]])
        this.polygon.createCache(90)
        this.thruster_polygon = new Polygon([[-1, 1], [-1, -2], [1, -2], [1, 1], [0, 2]])
        this.thruster_polygon.trueRotate(Math.PI)
        this.thruster_polygon.createCache(90)
        this.thruster_polygon.scale = 15
        this.renderPrepped = true
    }

    reset() {
        this.vx = 0
        this.vy = 0
        this.thrusters.left.setPower(0)
        this.thrusters.right.setPower(0)
        this.thrusters.left.angle = 0
        this.thrusters.right.angle = 0
        this.angle = 0
        this.angular_velocity = 0
        this.thrust_force.left = 0
        this.thrust_force.right = 0
        this.thrust_force.dx = 0
        this.thrust_force.dy = 0
    }

    calculateMaxVelocity(time=80) {
        let x = this.x
        let y = this.y
        this.reset()
        this.thrusters.left.setPower(1)
        this.thrusters.right.setPower(1)
        let t = 0
        let vy = this.terminal
        let vx = 0
        let av = 0
        while (t < time) {
            this.update(1)
            vy = Math.max(Math.abs(this.vy), vy)
            t ++
        }
        this.y = 0
        this.angle = Math.PI * 0.5
        t = 0
        while (t < time) {
            this.update(1)
            vx = Math.max(Math.abs(this.vx), vx)
            t++
        }
        t = 0
        this.thrusters.left.setPower(0)
        while (t < time) {
            this.update(1)
            av = Math.max(Math.abs(this.angular_velocity), av)
            t++
        }
        this.reset()
        this.x = x
        this.y = y
        return {angle:roundToNearestMultiple(av, 0.01), x: roundToNearestMultiple(vx, 0.5), y: roundToNearestMultiple(vy, 0.5)}
    }

    getThrust() {
        let angle_left = this.angle + this.thrusters.left.angle - Drone.HalfPI
        let angle_right = this.angle + this.thrusters.right.angle - Drone.HalfPI
        // console.log(Math.cos(angle_right).toFixed(2))
        // console.log((angle_left*180/Math.PI).toFixed(2))
        this.thrust_force.left = this.thrusters.left.getPower()
        this.thrust_force.right = this.thrusters.right.getPower()
        return {
            x: this.thrusters.left.getPower() * Math.cos(angle_left) + this.thrusters.right.getPower() * Math.cos(angle_right),
            y: this.thrusters.left.getPower() * Math.sin(angle_left) + this.thrusters.right.getPower() * Math.sin(angle_right)
        }
    }

    getTorque() {
        let angle_left = -this.thrusters.left.angle - Drone.HalfPI
        let left_torque = this.thrusters.left.getPower() / this.thrusters_offset * (-Math.sin(angle_left))
        let angle_right= this.thrusters.right.angle - Drone.HalfPI
        let right_torque = this.thrusters.right.getPower() / this.thrusters_offset * Math.sin(angle_right)
        return (left_torque + right_torque)*this.inertia
    }

    update(dt) {
        super.update(dt)
        this.thrusters.left.update(dt)
        this.thrusters.right.update(dt)
        this.vx *= this.damping
        this.vy *= this.damping
        let thrust = this.getThrust()
        this.vx += thrust.x * dt
        this.vy += (this.gravity + thrust.y) * dt
        this.vy = Math.min(this.vy, this.terminal)
        this.angular_velocity += this.getTorque() * dt
        this.angle += this.angular_velocity * dt
        this.angular_velocity *= this.damping
        //
    }

    draw(context, camera) {
        context.fillStyle = Game.COLORS.PRIMARY[2]
        this.polygon.rotate(this.angle)
        this.polygon.draw(context, camera.toScreenX(this.x), camera.toScreenY(this.y), 0, camera.scale)
        context.fillStyle = Game.COLORS.PRIMARY[0]
        drawCircle(context, camera.toScreenX(this.x), camera.toScreenY(this.y), camera.scale*25, 0)
        context.fillStyle = Game.COLORS.PRIMARY[3]
        let dx = Math.cos(this.angle) * this.thrusters_offset
        let dy = Math.sin(this.angle) * this.thrusters_offset
        this.thrust_force.dx = dx
        this.thrust_force.dy = dy
        this.thruster_polygon.rotate(this.thrusters.right.angle + this.angle)
        this.thruster_polygon.draw(context, camera.toScreenX(this.x + dx), camera.toScreenY(this.y + dy), 0, camera.scale)
        this.thruster_polygon.rotate(this.thrusters.left.angle + this.angle)
        this.thruster_polygon.draw(context, camera.toScreenX(this.x - dx), camera.toScreenY(this.y - dy), 0, camera.scale)
    }
}

class Thruster {
    #maxPower = 4
    constructor() {
        this.power_ratio = 0
        this.angle = 0
        this.target_angle = 0
        this.angle_var_speed = 0.1
        this.max_angle = Math.PI * 0.5
        this.angle_ratio = 0
    }

    setAngle(ratio) { this.target_angle = this.max_angle * Math.max(-1, Math.min(ratio, 1))}

    setPower(ratio) {this.power_ratio = Math.max(0, Math.min(1, ratio))}

    getPower() {return this.power_ratio * this.#maxPower}

    update(dt) {
        this.angle += (this.target_angle - this.angle) * this.angle_var_speed * dt
        this.angle_ratio = this.angle / this.max_angle
    }
}

class NeuralNetwork {
    // structure: [#inputs, #neuronsLayer1, #neuronsLayer2, ..., #outputs]
    constructor(structure) { 
        this.layers = Array.from({length: structure.length}).map(() => new NeuralLayer())
        this.structure = structure
        this.longestLength = Math.max(...structure)
    }

    resetValues() {this.layers.forEach(l => l.resetValues())}

    predict(inputs) {
        this.resetValues() // then
        this.layers[0].setValues(inputs)
        for (let i = 0; i < this.layers.length - 1; ++i) {
            this.layers[i].addToNextLayer(this.layers[i + 1])
        }
        return this.layers[this.layers.length - 1].neurons.map(n => n.value)
    }

    testInit() {
        for (let i = 0; i < this.structure.length - 1; ++i) {
            this.layers[i].randomFill(this.structure[i], this.structure[i + 1])
        }
        this.layers[this.structure.length - 1].neurons = Array.from({length: this.structure[this.structure.length - 1]}).map(() => new Neuron(null, 0))
    }

    load() {}
}

class NeuralLayer {
    static ACTIVATION_TYPES = {
        SIGMOID: 0,
        TANH: 1,
        ReLU: 2,
        LEAKY_ReLU: 3,
        SOFTMAX: 4,
        SWISH: 5,
        HARD_SIGMOID: 6,
        SOFTPLUS: 7,
        BINARY: 8
    }
    constructor() {
        this.neurons = []
        this.alpha = 0.01
        this.activationType = NeuralLayer.ACTIVATION_TYPES.TANH
    }
    activate(x, type=this.activationType) {
        switch (type) {
            case NeuralLayer.ACTIVATION_TYPES.SIGMOID:
                return 1 / (1 + Math.exp(-x));
            case NeuralLayer.ACTIVATION_TYPES.TANH:
                return Math.tanh(x);
            case NeuralLayer.ACTIVATION_TYPES.ReLU:
                return Math.max(0, x)
            case NeuralLayer.ACTIVATION_TYPES.LEAKY_ReLU:
                return x > 0 ? x : this.alpha * x;
            case NeuralLayer.ACTIVATION_TYPES.SOFTMAX:
                let exps = x.map(i => Math.exp(i));
                let sumExps = exps.reduce((s, e) => s + e, 0);                
                return exps.map(exp => exp / sumExps);
            case NeuralLayer.ACTIVATION_TYPES.SWISH: 
                return x * this.activate(x, NeuralLayer.ACTIVATION_TYPES.SIGMOID);
            case NeuralLayer.ACTIVATION_TYPES.HARD_SIGMOID: 
                return Math.max(0, Math.min(1, 0.2 * x + 0.5));
            case NeuralLayer.ACTIVATION_TYPES.SOFTPLUS:
                return Math.log(1 + Math.exp(x));
            case NeuralLayer.ACTIVATION_TYPES.BINARY:
                return x < 0 ? 0 : 1
            default:
                throw new Error("Activation function not implemented")
                break;
        }
    }
    addToNextLayer(layer) {
        this.neurons.forEach(n => {
            for (let i = 0; i < n.weights.length; ++i) {
                layer.neurons[i].value += n.weights[i] * n.value

            }
        })
        /*layer.neurons.forEach((neuron, i) => {
            neuron.value = neuron.weights.reduce((sum, weight, j) => sum + weight * this.neurons[j].value, neuron.bias);
        });*/
        layer.neurons.forEach(n => {n.value = layer.activate(n.value + n.bias, (n.activationType != null) ? n.activationType : this.activationType)})
    }
    randomFill(length, weightLength) {
        this.neurons = Array.from({length: length}).map(() => new Neuron(Array.from({length: weightLength}).map(() => -1 + Math.random()*2), Math.random()*0.01))
    }
    setValues(inputs) {
        for (let i = 0; i < inputs.length; ++i) {this.neurons[i].value = inputs[i]}
    }
    resetValues() {for (let i = 0; i < this.neurons.length; ++i) {this.neurons[i].value = 0}}
}

class Neuron {
    constructor(weights, bias=0) {
        this.weights = weights
        this.bias = bias
        this.value = 0
        this.activationType = null
    }
}

class NeuralNetworkVisualizer {
    constructor() {
        this.x = 0
        this.y = 0
        this.neuronSize = 20
        this.gapX = 50
        this.gapY = 20
        this.thickness = 4
        this.outlineThickness = 3
        this.colors = {
            positive: "rgb(72, 107, 127)",
            negative: "rgb(187, 71, 79)",
            node: "#d1bfb0",
            outline: "#392b35"
        }
        this.fontSize = 20
    }

    draw(ctx, network, scale=1) { // work on later
        let ogX = this.x
        let ogY = this.y
        this.x += this.outlineThickness*scale
        this.y += this.outlineThickness*scale*3
        let h = network.longestLength * (this.neuronSize + this.gapY) - this.gapY
        for (let l = 0; l < network.layers.length; ++l) {
            let x = (this.gapX + this.neuronSize*2) * l + this.neuronSize // change like y
            let marginTop = network.longestLength - network.layers[l].neurons.length
            marginTop *= (this.neuronSize + this.gapY/2)
            if (l != network.layers.length - 1) {
                let nx = (this.gapX + this.neuronSize*2) * (l + 1) + this.neuronSize
                for (let i = 0; i < network.layers[l].neurons.length; ++i) {
                    let y = (this.gapY + this.neuronSize*2) * i + this.neuronSize + marginTop
                    let mnx = network.longestLength - network.layers[l + 1].neurons.length 
                    mnx *= (this.neuronSize + this.gapY/2)
                    for (let k = 0; k < network.layers[l].neurons[i].weights.length; ++k) {
                        let ny = (this.gapY + this.neuronSize*2)*k + this.neuronSize + mnx
                        ctx.lineWidth = Math.abs(network.layers[l].neurons[i].weights[k] * this.thickness) * scale
                        ctx.strokeStyle = network.layers[l].neurons[i].weights[k] > 0 ? this.colors.positive : this.colors.negative
                        ctx.beginPath()
                        ctx.moveTo(this.x + x*scale, this.y + y*scale)
                        ctx.lineTo(this.x + nx*scale, this.y + ny*scale)
                        ctx.stroke()
                    }
                }
            }
            for (let i = 0; i < network.layers[l].neurons.length; ++i) {
                let y = (this.gapY + this.neuronSize*2) * i + this.neuronSize + marginTop
                ctx.fillStyle = this.colors.node
                ctx.strokeStyle = this.colors.outline
                ctx.lineWidth = scale * this.outlineThickness
                ctx.beginPath()
                ctx.arc(this.x + x*scale, this.y + y*scale, this.neuronSize*scale, 0, Math.PI*2)
                ctx.fill()
                ctx.stroke()
                ctx.fillStyle = this.colors.outline
                ctx.font = (this.fontSize*scale) + "px arial";
                ctx.fillText(network.layers[l].neurons[i].value.toFixed(1), this.x + x*scale - this.fontSize*scale*0.5, this.y + y*scale + this.fontSize*scale*0.5)
            }
            this.x = ogX
            this.y = ogY
        }
    }
}

class GeneticAlgorithm {
    static TYPES = {FITNESS: 0, LOSS: 1}
    static CROSSOVER = {ONE_POINT: 0, TWO_POINT: 1, UNIFORM: 2, ARITHMETIC: 3, BLXa: 4, OX: 5}
    static MUTATION = {SWAP: 0, SCRAMBLE: 1, INVERSE: 2, UNIFORM: 3, RESET: 4}
    constructor() {
        this.size = {population: 0, elite: 0, offspring: 0, mutate: 0}
        this.population = []
        this.type = GeneticAlgorithm.TYPES.FITNESS
        this.architecture = []
        this.dead = []
        this.generation = 0
        this.isTraining = false
        this.endGeneration = 0
    }
    draw(c, o){}frame(dt){}trainingFrame(dt=1){} 
    __forEach(callback) {for (let i = this.population.length - 1; i >= 0; i--) {callback.call(null, i)}}

    generate() {return new AIUnit(new NeuralNetwork(this.architecture))}

    init(population, elite, offspring, architecture=[1, 1]) {
        this.size.population = population
        this.size.elite = Math.floor(elite*population)
        this.size.offspring = Math.floor(offspring*population)
        this.size.mutate = population - this.size.elite - this.size.offspring
        if (this.size.mutate < 0) { // negative population??
            throw new Error("Nuh Uh")
        }
        this.architecture = architecture
        this.generation = 0
    }

    train(g) {
        this.isTraining = true
        this.endGeneration = g
        this.nextGeneration()
        while (this.generation < this.endGeneration) {
            this.trainingFrame(1)
        }
        // this.evaluation()
        this.isTraining = false
        this.endGeneration = 0
    }
    
    nextGeneration() {
        if (this.dead.length != 0) {
            this.population.concat(this.dead)
            this.evaluation()
            this.selection()
        } else {
            this.population = Array.from({length: this.size.population}, () => {
                let i = this.generate()
                i.setParent(this)
                return i
            })
        }
        this.population.forEach(p => p.reset())
        this.dead.forEach(d => d.destroy())
        this.dead = []
        console.log(this.generation)
        this.generation++
    }

    evaluation() {
        switch (this.type) { // elite first
            case GeneticAlgorithm.TYPES.LOSS: 
                this.dead.sort((a, b) => a.loss() - b.loss()) // small -> big
                break;
            case GeneticAlgorith.TYPES.FITNESS:
            default:
                this.dead.sort((a, b) => b.fitness() - a.fitness()) // big -> small
                break;
        }
    }

    selection() {
        this.evaluation()
        let newPopulation = this.dead.splice(0, this.size.elite)
        let crossover = []
        while (crossover.length < this.size.offspring) {
            this.crossover(...choiceMultiple(newPopulation, 2), crossover)
        }
        let mutated = []
        for (let i = 0; i < this.size.mutate; ++i) {
            mutated.push(this.mutate(choice(newPopulation).brain))
        }
        newPopulation.push(...crossover)
        newPopulation.push(...mutated)
        this.population = newPopulation
    }

    crossover(a, b, p) {
        let type = GeneticAlgorithm.chooseType([GeneticAlgorithm.CROSSOVER.ARITHMETIC, [GeneticAlgorithm.CROSSOVER.ONE_POINT, GeneticAlgorithm.CROSSOVER.TWO_POINT]])
        let c1 = AIUnit.getChromosomes(a.brain)
        let c2 = AIUnit.getChromosomes(b.brain)
        let indexes = randomIndices(c1.length - 1, Math.max(1, randint(1, Math.floor(c1.length) * 0.25)))
        let o1 = c1
        let o2 = c2
        indexes.forEach(i => {
            let children = GeneticAlgorithm.crossover(c1[i][0], c2[i][0], type)
            o1[i] = [children[0], c2[i][1]]
            o2[i] = [children[1], c1[i][1]]
        })
        c1 = null
        c2 = null
        let x = this.generate()
        let y = this.generate()
        x.setParent(this)
        y.setParent(this)
        AIUnit.fromChromosomes(o1, x.brain)
        AIUnit.fromChromosomes(o2, y.brain)
        p.push(x)
        p.push(y)
    }

    mutate(brain) {
        let type = GeneticAlgorithm.chooseType([GeneticAlgorithm.MUTATION.SWAP, GeneticAlgorithm.MUTATION.SCRAMBLE, GeneticAlgorithm.MUTATION.RESET])
        let c = AIUnit.getChromosomes(brain)
        GeneticAlgorithm.mutateChromosome(choice(c), type)
        let x = this.generate()
        AIUnit.fromChromosomes(c, x.brain)
        x.setParent(this)
        return x
    }


    static chooseType(array) { // [ARITH, [1point, 2point]]
        let i = Math.floor(Math.random() * array.length)
        if (typeof array[i] === "object") {
            return GeneticAlgorithm.chooseType(array[i])
        }
        return array[i]
    }

    static crossover(c1, c2, type) {
        let children = []
        if (c1.length !== c2.length) {throw new Error("Parents must be same length")}
        switch (type) {
            case GeneticAlgorithm.CROSSOVER.ONE_POINT:
                let point = Math.min(Math.max(Math.floor(Math.random()*c1.length), 1), c1.length - 1)
                children.push(c1.slice(0, point).concat(c2.slice(point, c2.length)))
                children.push(c2.slice(0, point).concat(c1.slice(point,  c1.length)))
                break;
            case GeneticAlgorithm.CROSSOVER.TWO_POINT:
                let point1 = Math.floor(Math.random()*(c1.length-1))
                let point2 = Math.floor(Math.random()*(c1.length-1))
                if (point2 < point1) {
                    [point1, point2] = [point2, point1]
                }
                children.push([...c1.slice(0, point1), ...c2.slice(point1, point2), ...c1.slice(point2)])
                children.push([...c2.slice(0, point1), ...c1.slice(point1, point2), ...c2.slice(point2)])
                break;
            case GeneticAlgorithm.CROSSOVER.UNIFORM:
                break;
            case GeneticAlgorithm.CROSSOVER.ARITHMETIC:
                let n = Math.floor(Math.random()*c1.length)
                let alpha = 0.25 + Math.random()*0.5
                children.push([...c1.slice(0, n), (1 - alpha)*c1[n] + alpha*c2[n], ...c1.slice(n+1, c1.length)])
                children.push([...c2.slice(0, n), (1 - alpha)*c2[n] + alpha*c1[n], ...c2.slice(n+1, c2.length)])
                break;
            case GeneticAlgorithm.CROSSOVER.BLXa:
                break;
            case GeneticAlgorithm.CROSSOVER.OX:
                break;
            default:
                throw new Error()
                break;
        }
        return children
    }

    static mutateChromosome(c, type) {
        // SWAP: 0, SCRAMBLE: 1, INVERSE: 2, UNIFORM: 3, RESET: 4
        switch (type) {
            case GeneticAlgorithm.MUTATION.SWAP:
                swapItems(c[0])
                break;
            case GeneticAlgorithm.MUTATION.SCRAMBLE:
                let [i1, i2] = randomTwoIndexes(c.length).sort((a, b) => {return a - b})
                shuffleSubarray(c[0], i1, i2)
                break;
            case GeneticAlgorithm.MUTATION.INVERSE:
                break;
            case GeneticAlgorithm.MUTATION.UNIFORM:
                break;
            case GeneticAlgorithm.MUTATION.RESET:
                c[1] = Math.random()
                break;
            default:
                throw new Error()
                break
        }
    }
}

class AIUnit {
    static getChromosomes(network) {
        let w = [] 
        for (let i = 0; i < network.layers.length - 1; ++i) {
            for (let j = 0; j < network.layers[i].neurons.length; ++j) {
                let z = []
                z.push(network.layers[i].neurons[j].weights.slice())
                z.push(network.layers[i].neurons[j].bias)
                w.push(z)
            }
        }
        return w
    }
    static fromChromosomes(c, network) {
        let s = 0
        network.resetValues()
        for (let i = 0; i < network.layers.length - 1; ++i) {
            for (let j = 0; j < network.layers[i].neurons.length; ++j) {
                network.layers[i].neurons[j].weights = c[s][0]
                network.layers[i].neurons[j].bias = c[s][1]
                s++
            }
        }
    }

    constructor(brain) { this.brain = brain; this.alive = false; this.parent = null }
    die() {this.alive = false}
    setParent(p) {this.parent = p;}
    // pass training target somehow
    reset() {this.alive=true} fitness() {} loss() {}

    trainingFrame(dt) {} draw(c, o) {}

    destroy() {this.parent = null; this.brain = null}
}

class DroneUnit extends AIUnit {
    #target = null
    static distance = 100
    static distanceSquared = this.distance**2
    static fuelConsumption = 0.001
    constructor(brain, render=true) {
        super(brain)
        this.drone = new Drone(render)
        this.brain.testInit()
        this.crashed = false
        this.time = 0
        this.targetIndex = -1
        this.fuel = 1
    }

    destroy() {super.destroy(); this.drone.destroy(); this.drone = null}

    reset() {
        super.reset()
        this.drone.reset()
        this.crashed = false
        this.time = 0
        this.targetIndex = -1
        this.#target = null
        this.drone.x = 0
        this.drone.y = 0
        this.setTarget()
    }

    die() {
        super.die()
        this.time = this.parent.time
    }

    setTarget() {
        this.fuel = 1
        this.targetIndex ++
        if (this.targetIndex >= this.parent.targets.length) {
            this.parent.addNewTarget()
        }
        this.#target = this.parent.targets[this.targetIndex]
    }

    trainingFrame(dt) {
        if (!this.alive) {
            return
        }
        super.trainingFrame()
        this.drone.update(dt)
        let dx = this.drone.x - this.#target.x
        let dy = this.drone.y - this.#target.y
        let results = this.brain.predict([
            dx/this.parent.box.width,
            dy/this.parent.box.height,
            this.drone.vx/this.parent.max.x,
            this.drone.vy/this.parent.max.y,
            Math.cos(this.drone.angle),
            Math.sin(this.drone.angle),
            this.drone.angular_velocity/this.parent.max.angle
        ])
        this.drone.thrusters.left.setPower(results[0])
        this.drone.thrusters.left.setAngle(results[1])
        this.drone.thrusters.right.setPower(results[2])
        this.drone.thrusters.right.setAngle(results[3])
        if (this.drone.thrust_force.left > 0 && this.drone.thrust_force.right > 0) {
            this.fuel -= DroneUnit.fuelConsumption
        }
        if (this.fuel <= 0 || !rangeCheck(this.drone.x, this.parent.box.right, this.parent.box.left) || !rangeCheck(this.drone.y, this.parent.box.bottom, this.parent.box.top)) {
            this.crashed = true
            this.die()
            return;
        }
        let distance = dx**2 + dy**2
        if (distance <= DroneUnit.distanceSquared) {
            this.setTarget()
        }
    }

    draw(context, camera) {
        if (!this.drone.renderPrepped) {
            this.drone.initRender()
        }
        let x = camera.toScreenX(this.drone.x)
        let y = camera.toScreenY(this.drone.y)
        this.drone.draw(context, camera)
        if (this.targetIndex != 0) {
            drawLine(context, x, y, camera.toScreenX(this.#target.x), camera.toScreenY(this.#target.y))
        }
        context.fillStyle = Game.COLORS.SECONDARY[0]
        drawRect(context, x - 70*camera.scale, y - 75*camera.scale, 140*camera.scale, 25*camera.scale)
        context.fillStyle = Game.COLORS.PRIMARY[1]
        drawRect(context, x - 70*camera.scale, y - 75*camera.scale, 140*camera.scale*this.fuel, 25*camera.scale)
        // camera.debugText(context, camera.toScreenX(this.drone.x), camera.toScreenY(this.drone.y), this.time, 50)
    }

    loss() {
        return -this.targetIndex + 0.5 * (this.crashed ? 1 : 0.9) * dist(this.drone.x, this.drone.y, this.#target.x, this.#target.y)/(dist(this.parent.box.width, this.parent.box.height, 0, 0)) * 1/(this.targetIndex + 1)
        // return -this.targetIndex
    }
}

class DroneNetwork extends NeuralNetwork {
    testInit() {
        super.testInit()
        this.layers[this.structure.length - 1].neurons[0].activationType = NeuralLayer.ACTIVATION_TYPES.SIGMOID
        this.layers[this.structure.length - 1].neurons[2].activationType = NeuralLayer.ACTIVATION_TYPES.SIGMOID
    }
}

window.onload = () => main()
</script>
